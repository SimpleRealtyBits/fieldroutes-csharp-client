name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add GitHub Packages source
        run: dotnet nuget add source --username SimpleRealtyBits --password '${{ secrets.GITHUB_TOKEN }}' --store-password-in-clear-text --name github "https://nuget.pkg.github.com/SimpleRealtyBits/index.json"

      - name: Tag and publish
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' fieldroutes-api-client.csproj)
          if ! git ls-remote --tags origin "v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          dotnet pack -c Release -o ./artifacts
          dotnet nuget push ./artifacts/*.nupkg --source github --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate
